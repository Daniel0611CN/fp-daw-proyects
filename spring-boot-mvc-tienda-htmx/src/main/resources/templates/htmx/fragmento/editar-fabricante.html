<form hx-target="this"
      hx-swap="outerHTML"
      th:hx-put="@{/htmx/fabricantes/editar/__${fabricante.codigo}__}"
      th:object="${fabricante}"
      hx-indicator="#indicator">
    <input type="hidden" name="numPag" th:value="${pagina.numeroDePagina}" />
    <input type="hidden" name="tamPag" th:value="${pagina.tamanio}" />
<div
     class="flex flex-row flex-wrap items-center h-16
     shadow-[6px_8px_38px_-11px_rgba(71,_135,_173,_0.65)]">
    <div class="basis-1/3">
        <input type="hidden" th:field="*{codigo}"/>
        <span th:text="*{codigo}"></span>
    </div>
    <div class="basis-1/3">
        <input class="shadow appearance-none border rounded w-1/2 py-2 px-3 text-gray-700 leading-tight" th:field="*{nombre}"/>
    </div>
    <div class="basis-1/3 flex justify-center">
        <button class="mx-0.5 btn btn-blue">Aceptar</button>
        <button class="mx-0.5 btn btn-red" hx-indicator="#indicator" th:hx-get="@{/htmx/fabricantes/fila/__${fabricante.codigo}__}">Cancelar</button>
    </div>
</div>
</form>
