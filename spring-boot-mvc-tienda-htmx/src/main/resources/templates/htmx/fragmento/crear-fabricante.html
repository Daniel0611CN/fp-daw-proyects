<form
      id="crear-form"
      th:hx-post="@{/htmx/fabricantes/crear}"
      th:object="${fabricante}"
      hx-swap-oob="true"
      hx-indicator="#indicator"
>
    <div
            class="flex flex-row flex-wrap items-center p-2
     shadow-[6px_8px_38px_-11px_rgba(71,_135,_173,_0.65)]">

        <div class="basis-1/3 flex items-center">
            <span class="font-bold">Automático</span>
        </div>
        <div class="basis-1/3">
            <input class="shadow appearance-none border rounded w-1/2 py-2 px-3 text-gray-700 leading-tight" th:field="*{nombre}"/>
        </div>
        <div class="basis-1/3 flex justify-center">
            <button class="mx-0.5 btn btn-blue">Aceptar</button>
            <button class="mx-0.5 btn btn-red" th:hx-get="@{/htmx/refrescar}"
                    hx-indicator="#indicator">Cancelar</button>
        </div>
    </div>
</form>
