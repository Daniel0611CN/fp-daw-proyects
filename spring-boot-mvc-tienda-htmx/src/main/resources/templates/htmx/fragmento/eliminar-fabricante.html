<div
        hx-target="this" hx-swap="outerHTML"
        class="flex flex-row flex-wrap  items-center p-2
     shadow-[6px_8px_38px_-11px_rgba(71,_135,_173,_0.65)]">
    <div class="basis-1/3" th:text="${fabricante.codigo}">Código</div>
    <div class="basis-1/3" th:text="${fabricante.nombre}">Nombre</div>
    <div class="basis-1/3 flex justify-center items-center">
            <div class="grid grid-cols-1 ">
                <div class="font-bold text-center items-center">
                    ¿Desea eliminarlo?
                </div>
                <div class="justify-center items-center">
                        <button class="btn btn-blue" th:hx-delete="@{/htmx/fabricantes/borrar/__${fabricante.codigo}__(numPag=${pagina.numeroDePagina},tamPag=${pagina.tamanio})}"
                                hx-indicator="#indicator">Aceptar</button>
                        <button class="btn btn-red" th:hx-get="@{/htmx/fabricantes/fila/__${fabricante.codigo}__}"
                                hx-indicator="#indicator">Cancelar</button>
                </div>
            </div>
    </div>
</div>
